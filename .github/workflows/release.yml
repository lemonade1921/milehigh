name: Release

# To publish, change VERSION on main (or push a tag like v0.2.0). This tags the release, builds
# binaries and .rpm/.pkg.tar.zst/.deb packages, and updates the Homebrew formula, PKGBUILD and
# Fedora spec on main to the new version (re-run for an existing tag just re-syncs those).
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "milehigh ${tag#v}"
          git push origin "$tag"
      - uses: actions/setup-go@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packaging:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the formula, PKGBUILD and spec at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The source archive GoReleaser attached to the release; its checksum is in checksums.txt.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/milehigh-${version}.tar.gz"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt
          sha=$(awk -v f="milehigh-${version}.tar.gz" '$2 == f {print $1}' checksums.txt)
          rm checksums.txt
          test -n "$sha"
          sed -i -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/milehigh.rb
          sed -i -E "s|^pkgver=.*|pkgver=${version}|; s|^pkgrel=.*|pkgrel=1|; s|^sha256sums=.*|sha256sums=('${sha}')|" packaging/arch/PKGBUILD
          sed -i -E "s|^Version:( +).*|Version:\1${version}|" packaging/fedora/milehigh.spec
          echo "$version" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula packaging VERSION
          git diff --cached --quiet || git commit -m "Update packaging to ${TAG}"
          git push origin HEAD:main
